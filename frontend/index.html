<script>

const text =
"Every Bite Feels Like Home ✨";

let index = 0;

function typeEffect(){

    if(index < text.length){

        document.getElementById(
            "typingText"
        ).innerHTML += text.charAt(index);

        index++;

        setTimeout(typeEffect,80);

    }

}

typeEffect();
