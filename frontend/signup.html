<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
    content="width=device-width, initial-scale=1.0">

    <title>VK Signup</title>

    <link rel="stylesheet" href="login.css">

</head>

<body>

    <div class="background-glow"></div>
    <div class="bg-particles">

    <span></span>
    <span></span>
    <span></span>
    <span></span>
    <span></span>
    <span></span>
    <span></span>
    <span></span>
    <span></span>
    <span></span>
    <span></span>
    <span></span>

</div>

    <div class="login-container">

        <!-- LEFT -->

        <div class="left-panel">

            <h1>
                🍽 VK Restaurant
            </h1>

            <p>
                Create your premium food account
            </p>

        </div>

        <!-- RIGHT -->

        <div class="right-panel">

            <h2>
                Create Account
            </h2>

            <p class="subtitle">
                Join the smart restaurant experience
            </p>

            <!-- IMPORTANT -->
            <!-- NO FORM TAG -->

            <input
            type="text"
            id="name"
            placeholder="Enter Name">

            <input
            type="email"
            id="email"
            placeholder="Enter Email">

            <input
            type="password"
            id="password"
            placeholder="Enter Password">

            <button
            type="button"
            onclick="signup()">

                Create Account

            </button>

            <p class="bottom-text">

                Already have an account?

                <a href="login.html">
                    Login
                </a>

            </p>

        </div>

    </div>

    <script src="./js/signup.js"></script>

</body>

</html>
